[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teststation-telemetry"
version = "0.1.0"
description = "MQTT telemetry pipeline for simulated test stations with fault injection and explainable anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.0,<3"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
telemetry = "telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
