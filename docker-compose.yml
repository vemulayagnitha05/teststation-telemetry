name: teststation-telemetry

x-app: &app
  build: .
  image: teststation-telemetry:local

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  ingestor:
    <<: *app
    command: ["ingest"]
    environment:
      MQTT_HOST: mosquitto
      DB_PATH: /data/telemetry.db
    volumes:
      - telemetry-data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ingestor.ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  simulator:
    <<: *app
    command: ["simulate", "--ticks", "300", "--ground-truth", "/data/ground_truth.json"]
    environment:
      MQTT_HOST: mosquitto
    volumes:
      - telemetry-data:/data
    depends_on:
      ingestor:
        condition: service_healthy
    restart: "no"

  analyzer:
    <<: *app
    profiles: ["tools"]
    command:
      - analyze
      - --db=/data/telemetry.db
      - --out=/out/report.html
      - --incidents=/out/incidents.jsonl
      - --csv=/out/results.csv
      - --ground-truth=/data/ground_truth.json
      - --check
    volumes:
      - telemetry-data:/data
      - ./output:/out

volumes:
  telemetry-data:
